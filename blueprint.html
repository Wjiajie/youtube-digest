<!doctype html>
<html lang="zh-CN" data-theme="sci-fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blueprint</title>
    <link rel="stylesheet" href="blueprint.css" />
  </head>
  <body>
    <a class="skip-link" href="#goalSpace">跳到目标</a>
    <main class="blueprint-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">Blueprint</p>
          <h1>我的目标蓝图</h1>
        </div>
        <button id="settingsButton" class="icon-button" type="button" aria-label="打开设置">
          <span aria-hidden="true">⚙</span>
        </button>
      </header>

      <section id="goalSpace" class="goal-space" aria-labelledby="goalSpaceTitle">
        <h2 id="goalSpaceTitle" class="sr-only">顶层目标</h2>
        <canvas id="blueprintCanvas" aria-hidden="true"></canvas>
        <div id="goalButtons" class="goal-buttons"></div>
        <div id="emptyBlueprint" class="empty-state">
          <p class="empty-title">还没有目标</p>
          <p>告诉规划师你想实现什么，它会为你生成第一版蓝图。</p>
          <button id="focusComposerButton" type="button">描述我的目标</button>
        </div>
      </section>

      <section class="planner-dock" aria-labelledby="plannerTitle">
        <div class="planner-header">
          <div>
            <p class="eyebrow">目标规划师</p>
            <h2 id="plannerTitle">和规划师讨论目标</h2>
          </div>
          <button id="toggleConversationButton" class="quiet-button" type="button" aria-expanded="true">
            收起对话
          </button>
        </div>
        <div id="conversation" class="conversation" aria-live="off"></div>
        <div id="plannerStatus" class="planner-status" role="status" aria-live="polite"></div>
        <form id="plannerForm" class="composer">
          <label for="plannerInput">你想实现什么目标？</label>
          <div class="composer-row">
            <textarea id="plannerInput" rows="2" maxlength="20000" placeholder="例如：我想在 6 个月内系统学习机器学习，并完成一个作品集项目。"></textarea>
            <button id="sendButton" class="primary-button" type="submit">发送目标</button>
            <button id="stopButton" class="secondary-button" type="button" hidden>停止生成</button>
          </div>
        </form>
      </section>
    </main>

    <dialog id="proposalDialog" aria-labelledby="proposalTitle">
      <div class="dialog-content">
        <h2 id="proposalTitle">查看蓝图修改</h2>
        <p id="proposalSummary" class="dialog-summary"></p>
        <pre id="proposalPreview" tabindex="0"></pre>
        <p id="proposalError" class="inline-error" role="alert"></p>
        <div class="dialog-actions">
          <button id="keepBlueprintButton" class="secondary-button" type="button">保留当前蓝图</button>
          <button id="applyBlueprintButton" class="primary-button" type="button">应用蓝图修改</button>
        </div>
      </div>
    </dialog>

    <script src="blueprint-domain.js"></script>
    <script src="blueprint.js"></script>
  </body>
</html>
