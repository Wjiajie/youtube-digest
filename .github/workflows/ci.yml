name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Validate public extension package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build extension and Native Agent Host
        run: |
          npm run build:extension
          npm run build:host

      - name: Test Native Agent Host
        run: npm run test:host

      - name: Build allowlisted ZIP
        run: npm run package

      - name: Show packaged files
        run: unzip -Z1 dist/blueprint-v*.zip
