name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-check:
    name: Validate M1 cloud slice
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test domain and extension behavior
        run: npm run test:m1

      - name: Execute embedded PostgreSQL contract
        run: npm run test:db-contract

      - name: Verify cloud setup wizard
        run: npm run check:m1-wizard

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Build Web and WXT extension
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          NEXT_PUBLIC_EXTENSION_OAUTH_CLIENT_ID: ci-extension-client
          WXT_PUBLIC_WEB_ORIGIN: https://blueprint.example
          WXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          WXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          WXT_PUBLIC_EXTENSION_OAUTH_CLIENT_ID: ci-extension-client
        run: |
          npm run build:web
          npm run build:wxt

      - name: Verify extension security surface
        run: node scripts/check-m1-extension.mjs

      - name: Install browser for Web journey checks
        run: npx playwright install --with-deps chromium

      - name: Test login journey on desktop and mobile
        run: npm run test:e2e

      - name: Test migrations and RLS contracts
        run: |
          npx --yes supabase@2.115.0 start
          npx --yes supabase@2.115.0 db reset
          npx --yes supabase@2.115.0 test db
          npx --yes supabase@2.115.0 stop --no-backup
