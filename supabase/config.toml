project_id = "blueprint-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "https://kipaapemlimhdkpcenelpjeccmnkninf.chromiumapp.org/**"]
enable_signup = false

[auth.email]
# Keep the email provider enabled for existing invited users. Global
# auth.enable_signup=false above remains the public-registration gate.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false
