<!doctype html>
<html lang="zh-CN" data-theme="sci-fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>目标路径 · Blueprint</title>
    <link rel="stylesheet" href="blueprint.css" />
    <link rel="stylesheet" href="goal.css" />
  </head>
  <body>
    <a class="skip-link" href="#goalPath">跳到学习路径</a>
    <main class="goal-page">
      <header class="goal-header">
        <button id="backButton" class="secondary-button" type="button">返回蓝图</button>
        <div>
          <p class="eyebrow">目标路径</p>
          <h1 id="goalTitle">加载中…</h1>
        </div>
        <button id="settingsButton" class="icon-button" type="button" aria-label="打开设置">⚙</button>
      </header>
      <section id="goalPath" class="path-surface" aria-labelledby="pathTitle">
        <h2 id="pathTitle" class="sr-only">里程碑和学习节点</h2>
        <div id="milestoneList" class="milestone-list"></div>
        <div id="goalError" class="empty-state" hidden>
          <p class="empty-title">找不到这个目标</p>
          <p>它可能已在新版蓝图中被删除或重命名。</p>
          <button id="returnButton" type="button">返回蓝图</button>
        </div>
      </section>
    </main>
    <script src="blueprint-domain.js"></script>
    <script src="goal.js"></script>
  </body>
</html>
